services:
  postgres:
    image: postgres:16
    container_name: ums-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: ums_payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d ums_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
